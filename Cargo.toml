[workspace]
members = ["crates/sqlite-mcp-core", "crates/sqlite-mcp", "crates/xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
rmcp = { version = "=1.7.0", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
rmcp-macros = "=1.7.0"
rusqlite = { version = "=0.40.1", features = ["bundled", "hooks", "limits", "column_decltype"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
toml = "0.9"
tempfile = "3"
serde_yaml = "0.9"
